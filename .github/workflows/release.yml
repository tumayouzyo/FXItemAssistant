name: Release package
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: package-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build archives
        run: python scripts/build_package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          python -c "import pathlib; text=pathlib.Path('CHANGELOG.md').read_text(); pathlib.Path('dist/release-notes.md').write_text(text.split('## ', 2)[1].split('\n', 1)[1].strip()+'\n')"
          gh release create "v$VERSION" dist/*.zip dist/*.unitypackage dist/package.json --target "$GITHUB_SHA" --title "v$VERSION" --notes-file dist/release-notes.md
